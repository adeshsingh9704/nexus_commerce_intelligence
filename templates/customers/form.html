
{% extends "customers/base.html" %}
{% block title %}Add Customer{% endblock %}

{% block content %}
<h1>Add New Customer</h1>
<p class="muted">Register a customer in your NEXUS database.</p>

<div class="card">
    <form method="POST">
        <label for="name">Full Name *</label>
        <input id="name" name="name" required placeholder="Enter customer name">

        <label for="phone">Phone Number *</label>
        <input id="phone" name="phone" required placeholder="Enter phone number">

        <label for="email">Email Address</label>
        <input id="email" name="email" type="email" placeholder="customer@example.com">

        <label for="city">City</label>
        <input id="city" name="city" placeholder="Enter city">

        <button class="btn" type="submit">Save Customer</button>
        <a class="btn secondary" href="{{ url_for('customers.customer_list') }}">Cancel</a>
    </form>
</div>
{% endblock %}
