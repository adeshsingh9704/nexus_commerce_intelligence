
{% extends "customers/base.html" %}
{% block title %}{{ 'Edit Product' if product else 'Add Product' }}{% endblock %}

{% block content %}
<h1>{{ 'Edit Product' if product else 'Add New Product' }}</h1>
<p class="muted">Enter product details and inventory information.</p>

<div class="card">
    <form method="POST">
        <label for="name">Product Name *</label>
        <input id="name" name="name" required
               value="{{ product.name if product else '' }}"
               placeholder="Example: Wireless Headphones">

        <label for="category">Category *</label>
        <input id="category" name="category" required
               value="{{ product.category if product else '' }}"
               placeholder="Example: Electronics">

        <label for="cost_price">Cost Price (₹) *</label>
        <input id="cost_price" name="cost_price" type="number"
               min="0" step="0.01" required
               value="{{ product.display_cost if product else '' }}">

        <label for="selling_price">Selling Price (₹) *</label>
        <input id="selling_price" name="selling_price" type="number"
               min="0" step="0.01" required
               value="{{ product.display_price if product else '' }}">

        <label for="stock">Available Stock *</label>
        <input id="stock" name="stock" type="number" min="0" required
               value="{{ product.display_stock if product else '0' }}">

        <label for="reorder_level">Reorder Level *</label>
        <input id="reorder_level" name="reorder_level" type="number" min="0" required
               value="{{ product.display_reorder if product else '10' }}">

        <button class="btn" type="submit">
            {{ 'Update Product' if product else 'Save Product' }}
        </button>
        <a class="btn secondary" href="{{ url_for('products.product_list') }}">Cancel</a>
    </form>
</div>
{% endblock %}
